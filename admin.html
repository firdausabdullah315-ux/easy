<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASY ADMIN - BLUE AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap');
body{margin:0;background:#060c1a;color:#e0f2ff;font-family:'Inter',sans-serif;padding:16px}
h1{font-family:'Orbitron';color:#38bdf8;text-shadow:0 0 10px #0ea5e9}
.card{background:linear-gradient(180deg, rgba(14,165,233,0.15), rgba(6,12,26,0.8));border:1px solid rgba(56,189,248,0.3);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 0 20px rgba(14,165,233,0.15);backdrop-filter:blur(10px)}
table{width:100%;border-collapse:collapse}
th{color:#7dd3fc;font-size:12px;letter-spacing:1px;padding:10px}
td{padding:14px 10px;border-bottom:1px solid rgba(56,189,248,0.1);font-size:14px}
.badge{padding:6px 12px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid}
.b-Baru{background:rgba(251,191,36,0.15);color:#fbbf24;border-color:#fbbf24}
.b-Tindakan{background:rgba(56,189,248,0.15);color:#38bdf8;border-color:#38bdf8}
.b-Selesai{background:rgba(52,211,153,0.15);color:#34d399;border-color:#34d399}
.ai-badge{background:rgba(168,85,247,0.2);color:#c084fc;border:1px solid #a855f7;padding:4px 10px;border-radius:99px;font-size:11px}
input,select{width:100%;padding:14px;background:rgba(6,12,26,0.8);border:1px solid rgba(56,189,248,0.4);border-radius:12px;color:#fff;margin-bottom:12px;box-sizing:border-box}
input:focus{outline:none;box-shadow:0 0 10px #0ea5e9;border-color:#38bdf8}
.btn{width:100%;padding:15px;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border:none;border-radius:12px;color:#00101d;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 0 15px #0ea5e9}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>
<h1>⚡ EASY MANAGEMENT AI</h1>
<div class="card">🤖 <b>AI Agents Online:</b> 3 Active | 💰 Kutipan: RM 1,250 | 🛠️ Aduan Baru: <span id="aCount">0</span></div>
<div class="card">
<b style="color:#38bdf8">📡 SENARAI ADUAN + AI ASSIGNMENT</b>
<table><thead><tr><th>UNIT</th><th>ADUAN</th><th>AI AGENT</th><th>STATUS</th></tr></thead><tbody id="list"></tbody></table>
</div>
<div class="card">
<b style="color:#38bdf8">➕ TAMBAH REKOD BARU (AI AUTO-ASSIGN)</b><br><br>
<input id="unit" placeholder="Unit: 4-14-16" value="4-14-16">
<input id="aduan" placeholder="Aduan: paip bocor / lif rosak / sampah">
<select id="status"><option>Baru</option><option>Dalam Tindakan</option><option>Selesai</option></select>
<button class="btn" onclick="save()">🚀 SIMPAN & ASSIGN AI AGENT</button>
<p id="msg" style="display:none;text-align:center;color:#34d399;margin-top:10px">✅ Berjaya! AI Agent telah di-assign!</p>
</div>
<script>
let data=JSON.parse(localStorage.getItem('easyBlueAI')||'[]');
if(data.length==0){data=[{unit:'4-05-11',aduan:'Lif rosak',agent:'ElectroBot ⚡',status:'Dalam Tindakan'},{unit:'4-14-16',aduan:'Sewa tertunggak',agent:'FinanceBot 💰',status:'Baru'}]}
function getAIAgent(text){
  text=text.toLowerCase();
  if(text.includes('paip')||text.includes('bocor')||text.includes('air')) return 'AquaBot 💧';
  if(text.includes('lif')||text.includes('elektrik')||text.includes('lampu')) return 'ElectroBot ⚡';
  if(text.includes('sewa')||text.includes('bayar')||text.includes('kutipan')) return 'FinanceBot 💰';
  if(text.includes('sampah')||text.includes('bising')||text.includes('parking')) return 'GuardBot 🛡️';
  return 'GeneralBot 🤖';
}
function render(){
  let tb=document.getElementById('list');tb.innerHTML='';
  data.slice().reverse().forEach(d=>{
    tb.innerHTML+=`<tr><td>${d.unit}</td><td>${d.aduan}</td><td><span class="ai-badge">${d.agent}</span></td><td><span class="badge b-${d.status.split(' ')[0]}">${d.status}</span></td></tr>`;
  });
  document.getElementById('aCount').innerText=data.filter(x=>x.status=='Baru').length;
  localStorage.setItem('easyBlueAI',JSON.stringify(data));
}
function save(){
  let u=document.getElementById('unit').value.trim();
  let a=document.getElementById('aduan').value.trim();
  let s=document.getElementById('status').value;
  if(!u||!a){alert('Isi Unit & Aduan dulu sayang!');return;}
  let agent=getAIAgent(a);
  data.push({unit:u,aduan:a,agent:agent,status:s});
  render();
  document.getElementById('msg').innerHTML=`✅ Berjaya! ${agent} telah di-assign untuk ${u}`;
  document.getElementById('msg').style.display='block';
  document.getElementById('aduan').value='';
  setTimeout(()=>document.getElementById('msg').style.display='none',2500);
}
render();
</script>
</body>
</html>
